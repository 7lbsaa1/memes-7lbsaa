  <!-- Main Content -->

  <main class="main">

    <div class="container">

      <!-- Filters -->

      <div class="filters">

        <button class="filter-btn active" data-filter="all">الكل</button>

        <button class="filter-btn" data-filter="top">أعلى</button>

        <button class="filter-btn" data-filter="new">جديد</button>

        <button class="filter-btn" data-filter="hot">🔥 رائج</button>

      </div>

        <!-- Memes will be loaded here -->

      </div>

    </div>

  </main>

  <!-- Upload Modal -->

  <div class="modal-overlay" id="uploadModal">

    <div class="modal">

      <div class="modal-header">

        <p class="upload-hint">PNG, JPG, GIF - حتى 10MB</p>

        <input type="file" id="fileInput" accept="image/*" hidden>

      </div>

      

      <div class="preview-container" id="previewContainer">

        <img src="" alt="Preview" class="preview-image" id="previewImage">

      </div>

      

      <button class="btn-submit" id="submitUpload" disabled>رفع الميمز</button>

    </div>

  </div>

    <span class="toast-icon">✓</span>

      { id: 151, src: "timps/meme151.jpg" },

      { id: 152, src: "timps/meme152.jpg" },

      { id: 153, src: "timps/meme153.jpg" },

      { id: 154, src: "timps/meme154.jpg" },

      { id: 155, src: "timps/meme155.jpg" },

      { id: 156, src: "timps/meme156.jpg" },

      { id: 157, src: "timps/meme157.jpg" },

      { id: 158, src: "timps/meme158.jpg" },

      { id: 159, src: "timps/meme159.jpg" },

      { id: 160, src: "timps/meme160.jpg" },

      { id: 161, src: "timps/meme161.jpg" },

      { id: 162, src: "timps/meme162.jpg" },

      { id: 163, src: "timps/meme163.jpg" },

      { id: 164, src: "timps/meme164.jpg" },

      { id: 165, src: "timps/meme165.jpg" }

    ];


    // DOM Elements

    const memesGrid = document.getElementById('memesGrid');

    const searchInput = document.getElementById('searchInput');

    const uploadBtn = document.getElementById('uploadBtn');

    const uploadModal = document.getElementById('uploadModal');

    const closeModal = document.getElementById('closeModal');

    const uploadArea = document.getElementById('uploadArea');

    const fileInput = document.getElementById('fileInput');

    const previewContainer = document.getElementById('previewContainer');

    const previewImage = document.getElementById('previewImage');

    const submitUpload = document.getElementById('submitUpload');

    const themeToggle = document.getElementById('themeToggle');

    const toast = document.getElementById('toast');

    const toastMessage = document.getElementById('toastMessage');

    const toastIcon = toast.querySelector('.toast-icon');

    const filterBtns = document.querySelectorAll('.filter-btn');


    let allMemes = [...imagesList];

    let selectedFile = null;


    // Render memes grid

    function renderMemes(memes) {

      memesGrid.innerHTML = '';

      

      if (memes.length === 0) {

        memesGrid.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">🔍</div>

            <p class="empty-text">لا توجد ميمزات</p>

          </div>

        `;

        return;

      }


      memes.forEach(meme => {

        const card = document.createElement('div');

        card.className = 'meme-card';

        card.innerHTML = `

          <div class="meme-image-container">

            <img src="${meme.src}" alt="ميمز #${meme.id}" class="meme-image" loading="lazy"

                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231a1a2e%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%238b5cf6%22 font-size=%2212%22>ميمز #${meme.id}</text></svg>'">

            <div class="meme-overlay">

              <button class="btn-download" onclick="handleDownload(${meme.id}, this)">

                <span>⬇️</span>

                <span>تحميل</span>

              </button>

            </div>

          </div>

          <div class="meme-info">

            <div class="meme-id">

              <span>#${meme.id}</span>

            </div>

          </div>

        `;

        memesGrid.appendChild(card);

      });

    }


    // Download handler

    window.handleDownload = async function(imageId, buttonElement) {

      const image = allMemes.find(img => img.id === imageId);

      if (!image) return;


      buttonElement.classList.add('loading');

      buttonElement.disabled = true;

      buttonElement.innerHTML = '<span>⏳</span><span>جاري...</span>';


      try {

        const response = await fetch(image.src);

        if (!response.ok) throw new Error('خطأ في التحميل');


        const imageBlob = await response.blob();

        const blobUrl = URL.createObjectURL(imageBlob);


        const downloadLink = document.createElement('a');

        downloadLink.href = blobUrl;

        downloadLink.download = `ميمز-${imageId}-${Date.now()}.jpg`;

        document.body.appendChild(downloadLink);

        downloadLink.click();

        document.body.removeChild(downloadLink);

        URL.revokeObjectURL(blobUrl);


        showToast('تم تحميل الميمز بنجاح!', 'success');

      } catch (error) {

        console.error('Download error:', error);

        showToast('حدث خطأ أثناء التحميل', 'error');

      } finally {

        buttonElement.classList.remove('loading');

        buttonElement.disabled = false;

        buttonElement.innerHTML = '<span>⬇️</span><span>تحميل</span>';

      }

    };


    // Toast notification

    function showToast(message, type = 'success') {

      toastMessage.textContent = message;

      toast.className = `toast ${type}`;

      toastIcon.textContent = type === 'success' ? '✓' : '✕';

      toast.classList.add('show');

      setTimeout(() => toast.classList.remove('show'), 3000);

    }


    // Theme toggle

    themeToggle.addEventListener('change', () => {

      document.body.setAttribute('data-theme', themeToggle.checked ? 'light' : 'dark');

      localStorage.setItem('theme', themeToggle.checked ? 'light' : 'dark');

    });


    // Load saved theme

    const savedTheme = localStorage.getItem('theme');

    if (savedTheme) {

      document.body.setAttribute('data-theme', savedTheme);

      themeToggle.checked = savedTheme === 'light';

    }


    // Search functionality

    searchInput.addEventListener('input', (e) => {

      const searchTerm = e.target.value.toLowerCase();

      const filtered = allMemes.filter(meme => 

        meme.id.toString().includes(searchTerm)

      );

      renderMemes(filtered);

    });


    // Filter functionality

    filterBtns.forEach(btn => {

      btn.addEventListener('click', () => {

        filterBtns.forEach(b => b.classList.remove('active'));

        btn.classList.add('active');

        const filter = btn.dataset.filter;

        if (filter === 'all') {

          renderMemes(allMemes);

        } else {

          // For demo, show first 20 for any filter

          renderMemes(allMemes.slice(0, 20));

        }

      });

    });


    // Upload Modal

    uploadBtn.addEventListener('click', () => {

      uploadModal.classList.add('active');

    });


    closeModal.addEventListener('click', () => {

      uploadModal.classList.remove('active');

      resetUpload();

    });


    uploadModal.addEventListener('click', (e) => {

      if (e.target === uploadModal) {

        uploadModal.classList.remove('active');

        resetUpload();

      }

    });


    // File upload

    uploadArea.addEventListener('click', () => fileInput.click());

    

    uploadArea.addEventListener('dragover', (e) => {

      e.preventDefault();

      uploadArea.classList.add('dragover');

    });


    uploadArea.addEventListener('dragleave', () => {

      uploadArea.classList.remove('dragover');

    });


    uploadArea.addEventListener('drop', (e) => {

      e.preventDefault();

      uploadArea.classList.remove('dragover');

      const file = e.dataTransfer.files[0];

      if (file && file.type.startsWith('image/')) {

        handleFileSelect(file);

      }

    });


    fileInput.addEventListener('change', (e) => {

      const file = e.target.files[0];

      if (file) handleFileSelect(file);

    });


    function handleFileSelect(file) {

      if (file.size > 10 * 1024 * 1024) {

        showToast('حجم الملف كبير جداً (الحد الأقصى 10MB)', 'error');

        return;

      }

      selectedFile = file;

      const reader = new FileReader();

      reader.onload = (e) => {

        previewImage.src = e.target.result;

        previewContainer.classList.add('active');

        submitUpload.disabled = false;

      };

      reader.readAsDataURL(file);

    }


    function resetUpload() {

      selectedFile = null;

      fileInput.value = '';

      previewImage.src = '';

      previewContainer.classList.remove('active');

      submitUpload.disabled = true;

    }


    // Submit upload to Firebase

    submitUpload.addEventListener('click', async () => {

      if (!selectedFile) return;


      submitUpload.disabled = true;

      submitUpload.textContent = 'جاري الرفع...';


      try {

        // Convert to base64 and save to Firestore

        const base64 = await fileToBase64(selectedFile);

        

        await addDoc(collection(db, 'pending_memes'), {

          image: base64,

          createdAt: serverTimestamp(),

          status: 'pending'

        });


        showToast('تم إرسال الميمز للمراجعة! سيتم نشره بعد موافقة الإدارة', 'success');

        uploadModal.classList.remove('active');

        resetUpload();

      } catch (error) {

        console.error('Upload error:', error);

        showToast('حدث خطأ أثناء الرفع. حاول مرة أخرى', 'error');

      } finally {

        submitUpload.disabled = false;

        submitUpload.textContent = 'رفع الميمز';

      }

    });


    function fileToBase64(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);

      });

    }


    // Load approved memes from Firebase

    async function loadApprovedMemes() {

      try {

        const q = query(

          collection(db, 'approved_memes'),

          orderBy('createdAt', 'desc')

        );

        const snapshot = await getDocs(q);

        const approvedMemes = snapshot.docs.map(doc => ({

          id: doc.id,

          src: doc.data().image,

          ...doc.data()

        }));

        if (approvedMemes.length > 0) {

          allMemes = [...approvedMemes.reverse(), ...imagesList];

        }

        renderMemes(allMemes);

      } catch (error) {

        console.error('Error loading approved memes:', error);

        renderMemes(allMemes);

      }

    }


    // Initialize

    loadApprovedMemes();

  </script>

</body>
