<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ميمز و تمبات-حلبسة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <header class="header">
    <div class="container">
      <a href="/" class="logo">
        <div class="logo-icon">7</div>
        <span class="logo-text">موقع حلبسة</span>
      </a>
      
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="ابحث عن ميمز..." id="searchInput">
      </div>
      
      <div class="header-actions">
        <button class="btn-upload" id="uploadBtn">
          <span>⬆️</span>
          <span>رفع ميمز</span>
        </button>
        
        <div class="theme-switch-wrapper">
          <label class="theme-switch">
            <input type="checkbox" class="theme-switch__checkbox" id="themeToggle">
            <div class="theme-switch__container">
              <div class="theme-switch__clouds"></div>
              <div class="theme-switch__stars-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 55" fill="none">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M135.831 3.00688C135.055 3.85027 134.111 4.29946 133 4.35447C134.111 4.40947 135.055 4.85867 135.831 5.71123C136.607 6.55462 136.996 7.56303 136.996 8.72727C136.996 7.95722 137.172 7.25134 137.525 6.59129C137.886 5.93124 138.372 5.39954 138.98 5.00535C139.598 4.60199 140.268 4.39114 141 4.35447C139.88 4.2903 138.936 3.85027 138.16 3.00688C137.384 2.16348 136.996 1.16425 136.996 0C136.996 1.16425 136.607 2.16348 135.831 3.00688ZM31 23.3545C32.1114 23.2995 33.0551 22.8503 33.8313 22.0069C34.6075 21.1635 34.9956 20.1642 34.9956 19C34.9956 20.1642 35.3837 21.1635 36.1599 22.0069C36.9361 22.8503 37.8798 23.2903 39 23.3545C38.2679 23.3911 37.5976 23.602 36.9802 24.0053C36.3716 24.3995 35.8864 24.9312 35.5248 25.5913C35.172 26.2513 34.9956 26.9572 34.9956 27.7273C34.9956 26.563 34.6075 25.5546 33.8313 24.7112C33.0551 23.8587 32.1114 23.4095 31 23.3545ZM0 36.3545C1.11136 36.2995 2.05513 35.8503 2.83131 35.0069C3.6075 34.1635 3.99559 33.1642 3.99559 32C3.99559 33.1642 4.38368 34.1635 5.15987 35.0069C5.93605 35.8503 6.87982 36.2903 8 36.3545C7.26792 36.3911 6.59757 36.602 5.98015 37.0053C5.37155 37.3995 4.88644 37.9312 4.52481 38.5913C4.172 39.2513 3.99559 39.9572 3.99559 40.7273C3.99559 39.563 3.6075 38.5546 2.83131 37.7112C2.05513 36.8587 1.11136 36.4095 0 36.3545ZM56.8313 24.0069C56.0551 24.8503 55.1114 25.2995 54 25.3545C55.1114 25.4095 56.0551 25.8587 56.8313 26.7112C57.6075 27.5546 57.9956 28.563 57.9956 29.7273C57.9956 28.9572 58.172 28.2513 58.5248 27.5913C58.8864 26.9312 59.3716 26.3995 59.9802 26.0053C60.5976 25.602 61.2679 25.3911 62 25.3545C60.8798 25.2903 59.9361 24.8503 59.1599 24.0069C58.3837 23.1635 57.9956 22.1642 57.9956 21C57.9956 22.1642 57.6075 23.1635 56.8313 24.0069ZM81 25.3545C82.1114 25.2995 83.0551 24.8503 83.8313 24.0069C84.6075 23.1635 84.9956 22.1642 84.9956 21C84.9956 22.1642 85.3837 23.1635 86.1599 24.0069C86.9361 24.8503 87.8798 25.2903 89 25.3545C88.2679 25.3911 87.5976 25.602 ... (line truncated)
                </svg>
              </div>
              <div class="theme-switch__circle-container">
                <div class="theme-switch__sun-moon-container">
                  <div class="theme-switch__moon">
                    <div class="theme-switch__spot"></div>
                    <div class="theme-switch__spot"></div>
                    <div class="theme-switch__spot"></div>
                  </div>
                </div>
              </div>
            </div>
          </label>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="top">أعلى</button>
        <button class="filter-btn" data-filter="new">جديد</button>
        <button class="filter-btn" data-filter="hot">🔥 رائج</button>
      </div>

      <div class="memes-grid" id="memesGrid">
        </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>موقع حلبسة للميمز - جميع الحقوق محفوظة ©2026</p>
    </div>
  </footer>

  <div class="modal-overlay" id="uploadModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">رفع ميمز جديد</h2>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📤</div>
        <p class="upload-text">اسحب الصورة هنا أو اضغط للاختيار</p>
        <p class="upload-hint">PNG, JPG, GIF - حتى 10MB</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
      
      <div class="preview-container" id="previewContainer">
        <img src="" alt="Preview" class="preview-image" id="previewImage">
      </div>
      
      <button class="btn-submit" id="submitUpload" disabled>رفع الميمز</button>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-message" id="toastMessage">تم بنجاح!</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBcQexCPESpz-AteK3jwUapYndPPxCQb3U",
      authDomain: "memes-90684.firebaseapp.com",
      projectId: "memes-90684",
      storageBucket: "memes-90684.firebasestorage.app",
      messagingSenderId: "254309006278",
      appId: "1:254309006278:web:3790dcf77f804fa1fb90c7",
      measurementId: "G-DB8NG9HTF4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Pre-defined memes list (IDs 1-13 from TikTok, 14-165 local)
    const imagesList = [
      // IDs 12-165: Local images
      ...Array.from({ length: 154 }, (_, i) => ({ id: i + 12, src: `timps/meme${i + 12}.jpg` }))
    ];

    // DOM Elements
    const memesGrid = document.getElementById('memesGrid');
    const searchInput = document.getElementById('searchInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadModal = document.getElementById('uploadModal');
    const closeModal = document.getElementById('closeModal');
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const submitUpload = document.getElementById('submitUpload');
    const themeToggle = document.getElementById('themeToggle');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = toast.querySelector('.toast-icon');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let allMemes = [...imagesList];
    let selectedFile = null;
    let base64Data = null;

    // Toast notification
    function showToast(message, type = 'success') {
      toastMessage.textContent = message;
      toast.className = `toast ${type}`;
      toastIcon.textContent = type === 'success' ? '✓' : '✕';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Theme toggle
    themeToggle.addEventListener('change', () => {
      document.body.setAttribute('data-theme', themeToggle.checked ? 'light' : 'dark');
      localStorage.setItem('theme', themeToggle.checked ? 'light' : 'dark');
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.body.setAttribute('data-theme', savedTheme);
      themeToggle.checked = savedTheme === 'light';
    }

    // Render memes grid
    function renderMemes(memes) {
      memesGrid.innerHTML = '';
      
      if (memes.length === 0) {
        memesGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p class="empty-text">لا توجد ميمزات</p>
          </div>
        `;
        return;
      }

      memes.forEach(meme => {
        const card = document.createElement('div');
        card.className = 'meme-card';
        card.innerHTML = `
          <div class="meme-image-container">
            <img src="${meme.src}" alt="ميمز #${meme.id}" class="meme-image" loading="lazy"
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231a1a2e%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%238b5cf6%22 font-size=%2212%22>ميمز #${meme.id}</text></svg>'">
            <div class="meme-overlay">
              <button class="btn-download" onclick="downloadMeme('${meme.src}')">
                <span>⬇️</span>
                <span>تحميل</span>
              </button>
            </div>
          </div>
          <div class="meme-info">
            <div class="meme-id">
              <span>#${meme.id}</span>
            </div>
          </div>
        `;
        memesGrid.appendChild(card);
      });
    }

    // Compress image and convert to base64
    async function compressAndConvertToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            // Create canvas for compression
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Calculate new dimensions (max 800px width/height)
            let width = img.width;
            let height = img.height;
            const maxSize = 800;
            
            if (width > maxSize || height > maxSize) {
              if (width > height) {
                height = (height / width) * maxSize;
                width = maxSize;
              } else {
                width = (width / height) * maxSize;
                height = maxSize;
              }
            }
            
            canvas.width = width;
            canvas.height = height;
            
            // Draw image
            ctx.drawImage(img, 0, 0, width, height);
            
            // Convert to base64 with 0.7 quality (70%)
            const base64 = canvas.toDataURL('image/jpeg', 0.7);
            resolve(base64);
          };
          
          img.onerror = () => reject(new Error('فشل في تحميل الصورة'));
          img.src = e.target.result;
        };
        
        reader.onerror = () => reject(new Error('فشل في قراءة الملف'));
        reader.readAsDataURL(file);
      });
    }

    // Download meme function
    window.downloadMeme = async function(src) {
      try {
        showToast('جاري تحميل الصورة...', 'success');
        
        const response = await fetch(src);
        if (!response.ok) throw new Error('خطأ في التحميل');

        const imageBlob = await response.blob();
        const blobUrl = URL.createObjectURL(imageBlob);

        const downloadLink = document.createElement('a');
        downloadLink.href = blobUrl;
        downloadLink.download = `ميمز-${Date.now()}.jpg`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobUrl);

        showToast('تم تحميل الميمز بنجاح!', 'success');
      } catch (error) {
        console.error('Download error:', error);
        showToast('حدث خطأ أثناء التحميل', 'error');
      }
    };

    // Search functionality
    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = allMemes.filter(meme => 
        meme.id.toString().includes(searchTerm)
      );
      renderMemes(filtered);
    });

    // Filter functionality
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        if (filter === 'all') {
          renderMemes(allMemes);
        } else {
          renderMemes(allMemes.slice(0, 20));
        }
      });
    });

    // Upload Modal
    uploadBtn.addEventListener('click', () => {
      uploadModal.classList.add('active');
    });

    closeModal.addEventListener('click', () => {
      uploadModal.classList.remove('active');
      resetUpload();
    });

    uploadModal.addEventListener('click', (e) => {
      if (e.target === uploadModal) {
        uploadModal.classList.remove('active');
        resetUpload();
      }
    });

    // File upload
    uploadArea.addEventListener('click', () => fileInput.click());
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFileSelect(file);
      } else {
        showToast('يرجى اختيار ملف صورة', 'error');
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFileSelect(file);
    });

    async function handleFileSelect(file) {
      // Check file size (max 10MB)
      if (file.size > 10 * 1024 * 1024) {
        showToast('حجم الملف كبير جداً (الحد الأقصى 10MB)', 'error');
        return;
      }

      // Check file type
      if (!file.type.startsWith('image/')) {
        showToast('يرجى اختيار ملف صورة', 'error');
        return;
      }

      selectedFile = file;
      
      try {
        // Show loading state
        previewImage.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%238b5cf6" font-size="14">جاري المعالجة...</text></svg>';
        previewContainer.classList.add('active');
        submitUpload.disabled = true;
        submitUpload.textContent = 'جاري الضغط...';

        // Compress and convert to base64
        base64Data = await compressAndConvertToBase64(file);
        
        // Show preview
        previewImage.src = base64Data;
        previewContainer.classList.add('active');
        submitUpload.disabled = false;
        submitUpload.textContent = 'رفع الميمز';
        
        showToast('تم اختيار الصورة - اضغط رفع لإرسالها', 'success');
      } catch (error) {
        console.error('Error processing image:', error);
        showToast('حدث خطأ في معالجة الصورة', 'error');
        resetUpload();
      }
    }

    function resetUpload() {
      selectedFile = null;
      base64Data = null;
      fileInput.value = '';
      previewImage.src = '';
      previewContainer.classList.remove('active');
      submitUpload.disabled = true;
      submitUpload.textContent = 'رفع الميمز';
    }

    // Submit upload to Firebase Firestore
    submitUpload.addEventListener('click', async () => {
      if (!base64Data) {
        showToast('يرجى اختيار صورة أولاً', 'error');
        return;
      }

      submitUpload.disabled = true;
      submitUpload.textContent = 'جاري الرفع...';

      try {
        console.log('Uploading to Firestore...');
        console.log('Base64 data length:', base64Data.length);
        
        // Save to Firestore
        const docRef = await addDoc(collection(db, 'pending_memes'), {
          image: base64Data,
          createdAt: serverTimestamp(),
          status: 'pending'
        });

        console.log('Document written with ID:', docRef.id);
        
        showToast('تم إرسال الميمز للمراجعة! سيتم نشره بعد موافقة الإدارة', 'success');
        uploadModal.classList.remove('active');
        resetUpload();
      } catch (error) {
        console.error('Upload error:', error);
        
        // Show specific error message
        let errorMessage = 'حدث خطأ أثناء الرفع. حاول مرة أخرى';
        
        if (error.code === 'permission-denied') {
          errorMessage = 'ليس لديك صلاحية الرفع. تحقق من إعدادات Firebase';
        } else if (error.code === ' quota-exceeded') {
          errorMessage = 'تم تجاوز الحد الأقصى للتخزين';
        } else if (error.code === 'unavailable') {
          errorMessage = 'الخدمة غير متاحة حالياً. تحقق من اتصالك بالإنترنت';
        }
        
        showToast(errorMessage, 'error');
      } finally {
        submitUpload.disabled = false;
        submitUpload.textContent = 'رفع الميمز';
      }
    });

    // Load approved memes from Firebase
    async function loadApprovedMemes() {
      try {
        const q = query(
          collection(db, 'approved_memes'),
          orderBy('createdAt', 'desc')
        );
        const snapshot = await getDocs(q);
        const approvedMemes = snapshot.docs.map(doc => ({
          id: doc.id,
          src: doc.data().image,
          ...doc.data()
        }));
        if (approvedMemes.length > 0) {
          allMemes = [...approvedMemes, ...imagesList];
        }
        renderMemes(allMemes);
      } catch (error) {
        console.error('Error loading approved memes:', error);
        renderMemes(allMemes);
      }
    }

    // Initialize
    loadApprovedMemes();
  </script>
</body>
</html>
